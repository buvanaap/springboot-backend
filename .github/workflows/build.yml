name: My First CI Pipeline
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Show files
        run: ls -la
      - name: Java Version
        run: java --version
      - name: Maven Version
        run: mvn --version
