name: My First CI Pipeline
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: 'staging'


env:
  IMAGE_NAME: buvanaa/spring-petclinic
  IMAGE_TAG: 3.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Show Environment
        run: echo "Environment is ${{ inputs.environment }}"
      - name: Build application
        run: mvn clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic-jar
          path: target/*.jar
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic-jar
      - name: Show files
        run: ls -la
      - name: Show downloaded files
        run: find . -type f 
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic-jar
          path: target
      - name: Check files
        run: ls -la
      - name: Check files
        run: ls -la target
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .
      - name: Create failure
        run: exit 1
      - name: Handle Failure
        if: ${{ failure() }}
        run: echo "A previous step failed"
        
