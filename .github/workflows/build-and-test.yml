name: Backend application build and test
on:
  push:
    branches:
      - main
    
jobs:
  build-and-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4   
      - name: going to build
        run: mvn clean install -DskipTests=true
      - name: testing
        run: mvn test



