name: Backend application build and test
on:
  push:
    branches:
      - main

jobs:
  build-and-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout pannu
        uses: actions/checkout@v7
      - name: build pannuvom
        run: mvn clean install -DskipTests=true
      - name: test pannuvom
        run: mvn test